name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
        env:
          IMG3D_FAKE_PROVIDER: "1"
      - name: Upload rendered app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-forge-screenshots
          path: output/playwright/*.png
          if-no-files-found: error
